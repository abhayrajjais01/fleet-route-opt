# ─── Continuous integration (Week 16, Track B) ────────────────────────────────────────────────
# Every push and pull request: backend test suite (unit, agent, RAG, security, end-to-end regression and the
# latency guards), frontend type-check and production build, and a build of both Docker images.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: pytest
        run: python -m pytest -q
      - name: Copilot latency benchmark
        run: python -m scripts.benchmark_copilot --runs 10

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm exec tsc -b
      - name: Production build
        run: pnpm exec vite build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend and frontend images
        run: docker compose build
      - name: Start the stack and smoke-test it through Nginx
        run: |
          docker compose up -d --wait --wait-timeout 180
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/api/v1/health
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v
